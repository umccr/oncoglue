---
version: 2
models:
  - name: sat_linx_fusions
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - library_workflow_run_hk
              - load_date
              - hash_diff
    columns:
      - name: library_workflow_run_hk
        data_type: varchar(64)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('link_library_workflow_run')
                field: library_workflow_run_hk
      - name: load_date
        data_type: date
      - name: hash_diff
        data_type: varchar(64)
      - name: record_source
        data_type: varchar(255)
      - name: last_seen_datetime
        data_type: timestamp
      - name: batch_id
        data_type: varchar(26)
      - name: batch_date
        data_type: date
      - name: breakendid5
        data_type: varchar
      - name: breakendid3
        data_type: varchar
      - name: name
        data_type: varchar
      - name: reported
        data_type: varchar
      - name: reported_type
        data_type: varchar
      - name: reportable_reasons
        data_type: varchar
      - name: phased
        data_type: varchar
      - name: likelihood
        data_type: varchar
      - name: chain_length
        data_type: double
      - name: chain_links
        data_type: double
      - name: chain_terminated
        data_type: varchar
      - name: domains_kept
        data_type: varchar
      - name: domains_lost
        data_type: varchar
      - name: skipped_exons_up
        data_type: double
      - name: skipped_exons_down
        data_type: double
      - name: fused_exon_up
        data_type: double
      - name: fused_exon_down
        data_type: double
      - name: gene_start
        data_type: varchar
      - name: gene_context_start
        data_type: varchar
      - name: transcript_start
        data_type: varchar
      - name: gene_end
        data_type: varchar
      - name: gene_context_end
        data_type: varchar
      - name: transcript_end
        data_type: varchar
      - name: junction_cn
        data_type: double
