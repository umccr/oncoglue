---
version: 2
models:
  - name: sat_isofox_transdata
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - library_workflow_run_hk
              - load_date
              - hash_diff
    columns:
      - name: library_workflow_run_hk
        data_type: varchar(64)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('link_library_workflow_run')
                field: library_workflow_run_hk
      - name: load_date
        data_type: date
      - name: hash_diff
        data_type: varchar(64)
      - name: record_source
        data_type: varchar(255)
      - name: last_seen_datetime
        data_type: timestamp
      - name: batch_id
        data_type: varchar(26)
      - name: batch_date
        data_type: date
      - name: gene_id
        data_type: varchar
      - name: gene_name
        data_type: varchar
      - name: transcript_id
        data_type: varchar
      - name: transcript_name
        data_type: varchar
      - name: exon_count
        data_type: bigint
      - name: transcript_length
        data_type: bigint
      - name: effective_length
        data_type: bigint
      - name: fitted_fragments
        data_type: double
      - name: raw_fitted_fragments
        data_type: double
      - name: tpm_adj
        data_type: double
      - name: tpm_raw
        data_type: double
      - name: transcript_bases_covered
        data_type: double
      - name: sj_supported
        data_type: double
      - name: sj_supported_unique
        data_type: double
      - name: sj_fragments_unique
        data_type: double
      - name: non_sj_fragments_unique
        data_type: double
      - name: fragments_discordant
        data_type: double
      - name: low_map_quality_fragments
        data_type: double
