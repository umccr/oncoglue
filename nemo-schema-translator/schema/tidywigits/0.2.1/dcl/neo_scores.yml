---
version: 2
models:
  - name: sat_neo_scores
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - library_workflow_run_hk
              - load_date
              - hash_diff
    columns:
      - name: library_workflow_run_hk
        data_type: varchar(64)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('link_library_workflow_run')
                field: library_workflow_run_hk
      - name: load_date
        data_type: date
      - name: hash_diff
        data_type: varchar(64)
      - name: record_source
        data_type: varchar(255)
      - name: last_seen_datetime
        data_type: timestamp
      - name: batch_id
        data_type: varchar(26)
      - name: batch_date
        data_type: date
      - name: ne_ids
        data_type: varchar
      - name: variant_type
        data_type: varchar
      - name: variant_info
        data_type: varchar
      - name: gene
        data_type: varchar
      - name: allele
        data_type: varchar
      - name: peptide
        data_type: varchar
      - name: flank_up
        data_type: varchar
      - name: flank_down
        data_type: varchar
      - name: score
        data_type: double
      - name: rank
        data_type: double
      - name: likelihood
        data_type: double
      - name: likelihood_rank
        data_type: double
      - name: exp_likelihood
        data_type: double
      - name: exp_likelihood_rank
        data_type: double
      - name: tpm_effective
        data_type: double
      - name: recog_sim
        data_type: double
      - name: other_allele_recog_sim
        data_type: double
      - name: allele_cn
        data_type: double
      - name: allele_disrupted
        data_type: varchar
