---
version: 2
models:
  - name: sat_alignments_markdup
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - library_workflow_run_hk
              - load_date
              - hash_diff
    columns:
      - name: library_workflow_run_hk
        data_type: varchar(64)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('link_library_workflow_run')
                field: library_workflow_run_hk
      - name: load_date
        data_type: date
      - name: hash_diff
        data_type: varchar(64)
      - name: record_source
        data_type: varchar(255)
      - name: last_seen_datetime
        data_type: timestamp
      - name: batch_id
        data_type: varchar(26)
      - name: batch_date
        data_type: date
      - name: library
        data_type: varchar
      - name: unpaired_reads_examined
        data_type: double
      - name: read_pairs_examined
        data_type: double
      - name: secondary_or_supplementary_reads
        data_type: double
      - name: unmapped_reads
        data_type: double
      - name: unpaired_read_duplicates
        data_type: double
      - name: read_pair_duplicates
        data_type: double
      - name: read_pair_optical_duplicates
        data_type: double
      - name: percent_duplication
        data_type: double
      - name: estimated_library_size
        data_type: double
