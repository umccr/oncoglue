---
version: 2
models:
  - name: sat_isofox_retintron
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - library_workflow_run_hk
              - load_date
              - hash_diff
    columns:
      - name: library_workflow_run_hk
        data_type: varchar(64)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('link_library_workflow_run')
                field: library_workflow_run_hk
      - name: load_date
        data_type: date
      - name: hash_diff
        data_type: varchar(64)
      - name: record_source
        data_type: varchar(255)
      - name: last_seen_datetime
        data_type: timestamp
      - name: batch_id
        data_type: varchar(26)
      - name: batch_date
        data_type: date
      - name: gene_id
        data_type: varchar
      - name: gene_name
        data_type: varchar
      - name: chrom
        data_type: varchar
      - name: strand
        data_type: double
      - name: position
        data_type: double
      - name: type
        data_type: varchar
      - name: frag_count
        data_type: double
      - name: spliced_frag_count
        data_type: double
      - name: dp_total
        data_type: double
      - name: transcript_info
        data_type: varchar
