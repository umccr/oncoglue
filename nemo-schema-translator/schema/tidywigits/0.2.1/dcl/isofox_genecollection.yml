---
version: 2
models:
  - name: sat_isofox_genecollection
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - library_workflow_run_hk
              - load_date
              - hash_diff
    columns:
      - name: library_workflow_run_hk
        data_type: varchar(64)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('link_library_workflow_run')
                field: library_workflow_run_hk
      - name: load_date
        data_type: date
      - name: hash_diff
        data_type: varchar(64)
      - name: record_source
        data_type: varchar(255)
      - name: last_seen_datetime
        data_type: timestamp
      - name: batch_id
        data_type: varchar(26)
      - name: batch_date
        data_type: date
      - name: gene_set_id
        data_type: varchar
      - name: gene_count
        data_type: double
      - name: chrom
        data_type: varchar
      - name: range_start
        data_type: double
      - name: range_end
        data_type: double
      - name: total_frags
        data_type: double
      - name: duplicates
        data_type: double
      - name: supporting_trans
        data_type: double
      - name: unspliced
        data_type: double
      - name: alt_sj
        data_type: double
      - name: chimeric
        data_type: double
      - name: low_map_qual
        data_type: double
      - name: fwd_strand
        data_type: double
      - name: rev_strand
        data_type: double
      - name: genes
        data_type: varchar
