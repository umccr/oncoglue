---
version: 2
models:
  - name: sat_linx_links
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - library_workflow_run_hk
              - load_date
              - hash_diff
    columns:
      - name: library_workflow_run_hk
        data_type: varchar(64)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('link_library_workflow_run')
                field: library_workflow_run_hk
      - name: load_date
        data_type: date
      - name: hash_diff
        data_type: varchar(64)
      - name: record_source
        data_type: varchar(255)
      - name: last_seen_datetime
        data_type: timestamp
      - name: batch_id
        data_type: varchar(26)
      - name: batch_date
        data_type: date
      - name: cluster_id
        data_type: varchar
      - name: chain_id
        data_type: varchar
      - name: chain_index
        data_type: varchar
      - name: chain_count
        data_type: double
      - name: lower_sv_id
        data_type: varchar
      - name: upper_sv_id
        data_type: varchar
      - name: lower_breakend_is_start
        data_type: varchar
      - name: upper_breakend_is_start
        data_type: varchar
      - name: chrom
        data_type: varchar
      - name: arm
        data_type: varchar
      - name: assembled
        data_type: varchar
      - name: traversed_sv_count
        data_type: double
      - name: length
        data_type: double
      - name: junction_cn
        data_type: double
      - name: junction_cn_uncertainty
        data_type: double
      - name: pseudogene_info
        data_type: varchar
      - name: ecdna
        data_type: varchar
