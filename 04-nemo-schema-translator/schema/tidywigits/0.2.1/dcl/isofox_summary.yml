---
version: 2
models:
  - name: sat_isofox_summary
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - library_workflow_run_hk
              - load_date
              - hash_diff
    columns:
      - name: library_workflow_run_hk
        data_type: varchar(64)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('link_library_workflow_run')
                field: library_workflow_run_hk
      - name: load_date
        data_type: date
      - name: hash_diff
        data_type: varchar(64)
      - name: record_source
        data_type: varchar(255)
      - name: last_seen_datetime
        data_type: timestamp
      - name: batch_id
        data_type: varchar(26)
      - name: batch_date
        data_type: date
      - name: sample_id
        data_type: varchar
      - name: qc_status
        data_type: varchar
      - name: frag_tot
        data_type: double
      - name: frag_dup
        data_type: double
      - name: frag_spliced_pct
        data_type: double
      - name: frag_unspliced_pct
        data_type: double
      - name: frag_alt_pct
        data_type: double
      - name: frag_chimeric_pct
        data_type: double
      - name: spliced_gene_count
        data_type: double
      - name: read_length
        data_type: double
      - name: frag_length_5th
        data_type: double
      - name: frag_length_50th
        data_type: double
      - name: frag_length_95th
        data_type: double
      - name: enriched_gene_pct
        data_type: double
      - name: median_gc_ratio
        data_type: double
      - name: forward_strand_pct
        data_type: double
