---
version: 2
models:
  - name: sat_dragencov_reportbedmain
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - library_workflow_run_hk
              - load_date
              - hash_diff
    columns:
      - name: library_workflow_run_hk
        data_type: varchar(64)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('link_library_workflow_run')
                field: library_workflow_run_hk
      - name: load_date
        data_type: date
      - name: hash_diff
        data_type: varchar(64)
      - name: record_source
        data_type: varchar(255)
      - name: last_seen_datetime
        data_type: timestamp
      - name: batch_id
        data_type: varchar(26)
      - name: batch_date
        data_type: date
      - name: chrom
        data_type: varchar
      - name: start
        data_type: bigint
      - name: end
        data_type: bigint
      - name: total_cvg
        data_type: double
      - name: mean_cvg
        data_type: double
      - name: q1_cvg
        data_type: double
      - name: median_cvg
        data_type: double
      - name: q3_cvg
        data_type: double
      - name: min_cvg
        data_type: double
      - name: max_cvg
        data_type: double
