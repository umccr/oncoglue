      - name: chr2
        data_type: varchar
      - name: pos2
        data_type: double
      - name: direction
        data_type: varchar
      - name: alt_depth
        data_type: double
      - name: bp1_depth
        data_type: double
      - name: bp2_depth
        data_type: double
      - name: total_depth
        data_type: double
