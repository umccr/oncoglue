---
version: 2
models:
  - name: sat_dragenvar_tmb
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - library_workflow_run_hk
              - load_date
              - hash_diff
    columns:
      - name: library_workflow_run_hk
        data_type: varchar(64)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('link_library_workflow_run')
                field: library_workflow_run_hk
      - name: load_date
        data_type: date
      - name: hash_diff
        data_type: varchar(64)
      - name: record_source
        data_type: varchar(255)
      - name: last_seen_datetime
        data_type: timestamp
      - name: batch_id
        data_type: varchar(26)
      - name: batch_date
        data_type: date
      - name: vars_tot_input
        data_type: double
      - name: vars_tot_input_tmbregion
        data_type: double
      - name: vars_filt
        data_type: double
      - name: vars_filt_nonsyn
        data_type: double
      - name: region_eligible_mb
        data_type: double
      - name: tmb
        data_type: double
      - name: tmb_nonsyn
        data_type: double
